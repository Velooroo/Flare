[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["net", "io-util", "macros", "rt"] }
serde_json = "1"
anyhow = "1.0"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
hex = "0.4"
dirs = "6.0.0"

# INFO: Flare's security foundation lives here, so both the daemon and the CLI
#       share one TLS/pinning implementation instead of two copies.
monolith = { path = "../monolith/rust", default-features = false }
rustls = "0.23.36"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
rcgen = "0.14.6"
webpki-roots = "1.0.5"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["net", "io-util", "macros", "rt", "rt-multi-thread", "time"] }
monolith = { path = "../monolith/rust", default-features = false }
